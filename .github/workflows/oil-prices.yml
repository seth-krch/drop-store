# Each morning: scrape Mobil 1 5W-20 prices and post the cheapest options for
# Kansas as a comment on the "Mobil 1 5W-20 daily prices" issue (watch it to
# get the report by email or in the GitHub app).
name: Mobil 1 5W-20 daily prices

on:
  schedule:
    - cron: "47 12 * * *" # 7:47 CDT / 6:47 CST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISSUE_TITLE: Mobil 1 5W-20 daily prices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # history.jsonl carries over between runs for the "vs last run" column.
      - uses: actions/cache/restore@v4
        with:
          path: oil-prices
          key: oil-prices-${{ github.run_id }}
          restore-keys: oil-prices-

      - name: Scrape
        run: >
          npm run -s oil:prices --
          --out oil-prices
          --quarts "${{ vars.OIL_QUARTS || '5' }}"
          --tax-rate "${{ vars.OIL_TAX_RATE || '8.75' }}"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: oil-prices
          key: oil-prices-${{ github.run_id }}

      - name: Post report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p oil-prices
          test -f oil-prices/latest.md || echo "Scrape failed: see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > oil-prices/latest.md
          cat oil-prices/latest.md >> "$GITHUB_STEP_SUMMARY"
          n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
                --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")
          if [ -z "$n" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "Daily report from .github/workflows/oil-prices.yml. Subscribe to get each one." > /dev/null
            n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          fi
          gh issue comment "$n" --body-file oil-prices/latest.md
