# Each morning: check Mobil 1 5W-20 prices and post the cheapest delivered-to-
# Kansas option as a comment on the "Mobil 1 5W-20 daily prices" issue
# (subscribe to it to get the report by email or in the GitHub app).
name: Mobil 1 5W-20 daily prices

on:
  schedule:
    - cron: "47 12 * * *" # 7:47 CDT / 6:47 CST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts/mobil1-prices
    env:
      ISSUE_TITLE: Mobil 1 5W-20 daily prices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y xvfb
      - name: Install browser (Camoufox, falling back to Patchright)
        run: |
          pip install -r requirements.txt
          python -m camoufox fetch || {
            pip uninstall -y camoufox && pip install patchright && patchright install --with-deps chromium
          }
      - run: xvfb-run -a python oil_prices.py --tax "${{ vars.OIL_TAX_RATE || '8.75' }}" --out report.md

      - name: Post report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f report.md || echo "Price check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
                --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")
          if [ -z "$n" ]; then
            gh issue create --title "$ISSUE_TITLE" --body "Daily report from .github/workflows/oil-prices.yml. Subscribe to get each one." > /dev/null
            n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          fi
          gh issue comment "$n" --body-file report.md
